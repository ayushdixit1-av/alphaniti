}.top-pills{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none}.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:7px;border:1px solid var(--border-subtle);background:#0d1522e6;font-family:var(--mono);font-size:11px;font-weight:600;white-space:nowrap;color:var(--text-main)}.pill-live{border-color:#10b98166;background:#10b9811a}.pill-holiday{border-color:#f59e0b73;background:#f59e0b1a}.pill-purple{border-color:#a855f773;background:#a855f71f}.dot{width:7px;height:7px;border-radius:50%}.dot-green{background:var(--accent-green);box-shadow:0 0 8px var(--accent-green);animation:pulseDot 2s infinite}.dot-amber{background:var(--accent-amber);box-shadow:0 0 8px var(--accent-amber)}@keyframes pulseDot{0%,to{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.85)}}.top-right{display:flex;align-items:center;gap:10px;flex-shrink:0}.search-trigger{display:flex;align-items:center;gap:8px;padding:5px 11px;border-radius:7px;border:1px solid var(--border-subtle);background:#0d1522f2;color:var(--text-muted);font-size:11.5px;cursor:pointer;min-width:155px;transition:border-color .15s}.search-trigger:hover{border-color:var(--accent-cyan);color:var(--text-main)}.clock-box{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--text-main)}.icon-btn{background:transparent;border:1px solid transparent;color:var(--text-muted);border-radius:6px;padding:5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.icon-btn:hover{color:var(--text-main);background:#ffffff0d;border-color:var(--border-subtle)}.shell-body{display:flex;flex:1;min-height:0}.left-rail{width:56px;background:#090e16f5;border-right:1px solid var(--border-subtle);display:flex;flex-direction:column;align-items:center;padding:10px 6px;gap:8px;flex-shrink:0}.rail-btn{width:44px;padding:8px 4px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-size:10px;font-weight:600;transition:all .15s}.rail-btn:hover{color:var(--text-main);background:#ffffff0a}.rail-btn.active{color:var(--accent-cyan);background:#38bdf81f;border-color:#38bdf873;box-shadow:0 0 12px #38bdf81f}.main-area{flex:1;min-width:0;display:flex;flex-direction:column;padding:8px 12px;gap:8px}.workspace-bar{display:flex;align-items:center;justify-content:space-between;gap:12px}.workspace-tabs{display:flex;align-items:center;gap:6px}.ws-label{font-size:11px;color:var(--text-dim);margin-right:4px}.ws-tab{padding:4px 12px;border-radius:6px;border:1px solid var(--border-subtle);background:var(--bg-panel);color:var(--text-muted);font-size:11.5px;font-weight:600;cursor:pointer;transition:all .15s}.ws-tab:hover{color:var(--text-main);border-color:#94a3b859}.ws-tab.active{color:var(--accent-cyan);background:#38bdf81f;border-color:#38bdf880}.panel-card{background:linear-gradient(180deg,#0d1522f0,#080d16fa);border:1px solid var(--border-subtle);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}.panel-head{padding:8px 12px;border-bottom:1px solid rgba(148,163,184,.09);display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700}.cockpit-row1{display:grid;grid-template-columns:242px minmax(0,1fr) 310px;gap:8px;min-height:430px}.watchlist-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}.watchlist-table th{text-align:left;padding:6px 10px;font-size:10px;font-weight:600;color:var(--text-dim);border-bottom:1px solid rgba(148,163,184,.08)}.watchlist-table td{padding:7px 10px;border-bottom:1px solid rgba(148,163,184,.05);cursor:pointer}.watchlist-row:hover{background:#38bdf80f}.watchlist-row.active{background:#38bdf824;box-shadow:inset 3px 0 0 var(--accent-cyan)}.ticker-hero-bar{padding:8px 12px;border-bottom:1px solid rgba(148,163,184,.1);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.hero-metrics-row{display:flex;align-items:center;gap:14px;font-family:var(--mono)}.hero-metric{display:flex;flex-direction:column;align-items:flex-end;gap:1px}.hero-metric-lbl{font-size:9px;color:var(--text-dim)}.hero-metric-val{font-size:11.5px;font-weight:700}.chart-toolbar{padding:5px 12px;border-bottom:1px solid rgba(148,163,184,.08);display:flex;align-items:center;justify-content:space-between;gap:8px;background:#06090e80}.tf-btn{background:transparent;border:1px solid transparent;color:var(--text-muted);font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;cursor:pointer}.tf-btn:hover{color:var(--text-main)}.tf-btn.active{background:#38bdf826;border-color:#38bdf873;color:var(--accent-cyan)}.right-col-stack{display:flex;flex-direction:column;gap:8px}.rec-banner{margin:10px 12px 6px;padding:10px 12px;border-radius:8px;background:#38bdf814;border:1px solid rgba(56,189,248,.35)}.kv-list{padding:4px 12px 10px;display:flex;flex-direction:column;gap:6px;font-size:11.5px}.kv-row{display:flex;justify-content:space-between;align-items:center}.cockpit-row2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.factor-row{display:grid;grid-template-columns:64px 1fr 24px;align-items:center;gap:8px;font-size:11px}.factor-track{height:7px;border-radius:999px;background:#ffffff12;overflow:hidden}.factor-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#06b6d4,#10b981);transition:width .35s ease}.telemetry-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px}.telemetry-table th{text-align:left;padding:6px 12px;font-size:10px;color:var(--text-dim);border-bottom:1px solid rgba(148,163,184,.08)}.telemetry-table td{padding:5px 12px;border-bottom:1px solid rgba(148,163,184,.04)}.lvl-pill{padding:1px 6px;border-radius:4px;font-size:9.5px;font-weight:700}.cmd-backdrop{position:fixed;top:0;right:0;bottom:0;left:0;background:#02050ab8;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:200;display:flex;justify-content:center;align-items:flex-start;padding-top:90px}.cmd-modal{width:520px;max-width:92vw;background:var(--bg-surface);border:1px solid rgba(56,189,248,.45);border-radius:12px;overflow:hidden;box-shadow:0 24px 60px #000000a6}@media (max-width: 1260px){.cockpit-row1{grid-template-columns:220px minmax(0,1fr)}.right-col-stack{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr}.cockpit-row2{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width: 820px){.left-rail{display:none}.cockpit-row1,.right-col-stack,.cockpit-row2{grid-template-columns:1fr}}</style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
